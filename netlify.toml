[build]
  command = "npm run build"
  publish = "dist"

# Les pages sont pré-rendues en HTML statique ; ce fallback ne sert que
# pour les URLs inconnues (l'app affiche alors l'accueil).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
